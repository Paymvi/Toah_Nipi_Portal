<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>toah-nipi-portal</title>

    <!-- Runs before anything paints so a saved Night choice never flashes Light. Same key as the booking software. -->
    <style>
      @media screen {
        html[data-theme="night"] {
          color-scheme: dark;
          background: #15171e;
        }
      }
    </style>
    <script>
      (function () {
        var theme = "light";
        try {
          if (localStorage.getItem("toahNipiTheme") === "night") theme = "night";
        } catch (error) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
